<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby-Tagebuch</title>
<meta name="description" content="Stillen, Fläschchen, Schlaf und Windeln tracken – schnell, einfach, offline.">
<meta name="theme-color" content="#f5f3fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baby">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
  // Theme vor dem ersten Zeichnen setzen (kein Aufblitzen nachts)
  try { var t = JSON.parse(localStorage.getItem('baby.v1') || '{}').settings; if (t && t.theme && t.theme !== 'auto') document.documentElement.dataset.theme = t.theme; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="ttl"><h1 id="title">Heute</h1><small id="sub"></small></div>
  <div id="hact" class="hact"></div>
</header>

<main id="main"></main>

<nav class="tabbar" id="tabbar">
  <button data-act="tab" data-view="today">
    <svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v3.2L7.6 9.4A3 3 0 0 0 7 11.2V19a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-7.8a3 3 0 0 0-.6-1.8L14 6.2V3"/><path d="M7 13h10"/></svg>
    <span>Heute</span>
  </button>
  <button data-act="tab" data-view="stats">
    <svg viewBox="0 0 24 24"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>
    <span>Statistik</span>
  </button>
  <button data-act="tab" data-view="todo">
    <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>
    <span>To-do</span><i class="badge" id="todoBadge" hidden></i>
  </button>
  <button data-act="tab" data-view="more">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    <span>Mehr</span>
  </button>
</nav>

<div id="sheets"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="../shared/cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
