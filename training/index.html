<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training → Körper-Coach</title>
<meta name="theme-color" content="#eef4e7">
<meta http-equiv="refresh" content="0; url=../koerper/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4e7;color:#2a2605;font:16px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:24px}a{color:#646536;font-weight:700}</style>
</head>
<body>
<!-- Die Training-App ist im Körper-Coach aufgegangen. Diese Seite leitet alte Lesezeichen und Home-Bildschirm-Icons weiter;
     der Körper-Coach übernimmt die Daten (training.v1) automatisch. -->
<p>Training ist jetzt Teil des <b>Körper-Coach</b>.<br>Deine Daten werden dort automatisch übernommen.<br><br><a href="../koerper/">Zum Körper-Coach →</a></p>
<script>
  // alten Offline-Cache der Training-App entfernen, dann weiter
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (/\/training\/$/.test(r.scope)) r.unregister(); })).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => { if (k.startsWith('training-')) caches.delete(k); })).catch(() => {});
  setTimeout(() => location.replace('../koerper/'), 300);
</script>
</body>
</html>
