<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training</title>
<meta name="description" content="Schlaf, Ruhepuls, Rad- und Krafteinheiten – Tagesampel und Wochenbilanz.">
<meta name="theme-color" content="#f2f6f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
  try { var t = JSON.parse(localStorage.getItem('training.v1') || '{}').settings; if (t && t.theme && t.theme !== 'auto') document.documentElement.dataset.theme = t.theme; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="ttl"><h1 id="title">Heute</h1><small id="sub"></small></div>
  <div id="hact" class="hact"></div>
</header>

<main id="main" class="wrap"></main>

<nav class="tabbar" id="tabbar">
  <button data-act="tab" data-view="heute">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
    <span>Heute</span>
  </button>
  <button data-act="tab" data-view="woche">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Woche</span>
  </button>
  <button data-act="tab" data-view="verlauf">
    <svg viewBox="0 0 24 24"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>
    <span>Verlauf</span>
  </button>
  <button data-act="tab" data-view="mehr">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    <span>Mehr</span>
  </button>
</nav>

<div id="sheets"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="../shared/cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
