<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaffee-Logbuch</title>
<meta name="description" content="Espresso-Shots tracken, Rezepte vergleichen und Empfehlungen zum Einstellen bekommen.">
<meta name="theme-color" content="#f6f1ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kaffee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
  // Theme vor dem ersten Zeichnen setzen (kein Aufblitzen)
  try { var t = JSON.parse(localStorage.getItem('kaffee.v1') || '{}').settings; if (t && t.theme && t.theme !== 'auto') document.documentElement.dataset.theme = t.theme; } catch (e) {}
</script>
</head>
<body>
<noscript><p style="padding:24px;font:16px sans-serif">Das Kaffee-Logbuch braucht JavaScript.</p></noscript>
<header class="top">
  <div class="ttl"><h1 id="title">Shot</h1><small id="sub"></small></div>
  <div id="hact" class="hact"></div>
</header>

<main id="main"></main>

<nav class="tabbar" id="tabbar" aria-label="Bereiche">
  <button data-act="tab" data-view="shot">
    <svg viewBox="0 0 24 24"><path d="M4 9h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10.5h1.5a2.5 2.5 0 0 1 0 5H17M8 2.5c-.8 1 .8 2 0 3.5M12 2.5c-.8 1 .8 2 0 3.5"/></svg>
    <span>Shot</span>
  </button>
  <button data-act="tab" data-view="log">
    <svg viewBox="0 0 24 24"><path d="M4 20h16M6 16l4-5 3 3 5-7"/></svg>
    <span>Verlauf</span>
  </button>
  <button data-act="tab" data-view="beans">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="6.5" ry="9" transform="rotate(35 12 12)"/><path d="M8.2 18.5c2-2.4 1.6-4.4 3-6.5s3.6-2.6 4.6-5"/></svg>
    <span>Bohnen</span>
  </button>
  <button data-act="tab" data-view="more">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    <span>Mehr</span>
  </button>
</nav>

<div id="sheets"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="../shared/cloud.js"></script>
<script src="advice.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
