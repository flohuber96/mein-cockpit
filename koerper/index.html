<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Körper-Coach</title>
<meta name="description" content="Kraft, Mobility, Körper, Rad und Wohlbefinden: verstehen, tracken, gezielt trainieren.">
<meta name="theme-color" content="#f3f6f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Körper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
  // Theme vor dem ersten Zeichnen setzen (kein Aufblitzen nachts)
  try { var t = JSON.parse(localStorage.getItem('koerper.v1') || '{}').settings; if (t && t.theme && t.theme !== 'auto') document.documentElement.dataset.theme = t.theme; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="ttl"><h1 id="title">Heute</h1><small id="sub"></small></div>
  <div id="hact" class="hact"></div>
</header>

<main id="main"></main>

<div id="dock" class="dock"></div>

<nav class="tabbar" id="tabbar">
  <button data-act="tab" data-view="home">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
    <span>Heute</span>
  </button>
  <button data-act="tab" data-view="body">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="4.6" r="2.3"/><path d="M5 9.5c2.3.9 4.6 1.2 7 1.2s4.7-.3 7-1.2M12 10.7V15M12 15l-3.2 6.5M12 15l3.2 6.5"/></svg>
    <span>Körper</span>
  </button>
  <button data-act="tab" data-view="train">
    <svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
    <span>Kraft</span>
  </button>
  <button data-act="tab" data-view="mob">
    <svg viewBox="0 0 24 24"><circle cx="17.5" cy="5" r="2.2"/><path d="M3 20h5.5l4-6.5 4 2.5 4.5-.5M12.5 13.5 15 8.5l-5.5-1-3 3.5"/></svg>
    <span>Mobility</span>
  </button>
  <button data-act="tab" data-view="ride">
    <svg viewBox="0 0 24 24"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9.5 8.5h6l3 8M9.5 8.5 13 16.5M8 5.5h3M15.5 8.5 14.5 5.5h2.5"/></svg>
    <span>Rad</span>
  </button>
</nav>

<div id="full" class="full" hidden></div>
<div id="sheets"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="../shared/cloud.js"></script>
<script src="../koerper-data.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="body.js"></script>
<script src="train.js"></script>
<script src="mob.js"></script>
<script src="fit.js"></script>
<script src="ride.js"></script>
<script src="well.js"></script>
<script src="home.js"></script>
</body>
</html>
